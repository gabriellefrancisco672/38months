<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>38 months with you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#ffeef3; --panel:#ffd6e3; --rose:#d6457a; --butter:#9c2f5e; --text:#4a2335; --muted:#7d4a60;
  --serif:"Young Serif",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#fff3f7,#ffe3ec 50%,#fff3f7);color:var(--text);font:400 1.05rem/1.6 var(--sans);overflow-x:hidden}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.1}
section{padding:5rem 1.25rem;max-width:960px;margin:0 auto}
h2{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:.5rem}
.sub{color:var(--muted);margin-bottom:2.5rem;max-width:52ch}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1rem;max-width:none}
.big{font:400 clamp(9rem,38vw,22rem)/.8 var(--serif);color:var(--rose);letter-spacing:-.04em}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem)}
.clock{display:flex;gap:1.25rem;margin-top:1.5rem;flex-wrap:wrap;justify-content:center}
.clock div{min-width:4.5rem}
.clock b{display:block;font:400 2rem var(--serif);color:var(--butter);font-variant-numeric:tabular-nums}
.clock span{font-size:.85rem;color:var(--muted)}
.hint{margin-top:2rem;color:var(--muted);font-size:.9rem}

/* timeline */
.tl{position:relative;padding-left:2rem}
.tl::before{content:"";position:absolute;left:.45rem;top:.4rem;bottom:.4rem;width:2px;background:var(--rose);opacity:.5}
.ev{position:relative;margin-bottom:2rem;background:var(--panel);padding:1.1rem 1.3rem;border-radius:4px 18px 4px 18px}
.ev::before{content:"";position:absolute;left:-2rem;top:1.3rem;width:.95rem;height:.95rem;border-radius:50%;background:var(--butter);border:3px solid var(--ink)}
.ev time{color:var(--butter);font-size:.9rem;font-weight:600}
.ev h3{font:400 1.3rem var(--serif);margin:.2rem 0}
.ev p{color:var(--muted)}
@media(min-width:760px){
  .tl{padding:0}
  .tl::before{left:50%;transform:translateX(-1px)}
  .ev{width:calc(50% - 2rem)}
  .ev:nth-child(odd){margin-right:auto}
  .ev:nth-child(even){margin-left:auto;border-radius:18px 4px 18px 4px}
  .ev::before{top:1.3rem}
  .ev:nth-child(odd)::before{left:auto;right:-2.5rem}
  .ev:nth-child(even)::before{left:-2.5rem}
}

/* reasons */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
.card{perspective:800px;background:none;border:0;padding:0;aspect-ratio:1;cursor:pointer;color:inherit;font:inherit}
.in{position:relative;display:block;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card[aria-pressed="true"] .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:.8rem;border-radius:14px;backface-visibility:hidden}
.f{background:var(--panel);font:400 2.4rem var(--serif);color:var(--rose)}
.b{background:var(--rose);color:var(--ink);transform:rotateY(180deg);font-size:.92rem;line-height:1.35;font-weight:600}
.card.bonus{grid-column:1/-1;aspect-ratio:auto;min-height:9rem}
.card.bonus .f{font-size:1.5rem;background:var(--butter);color:var(--ink)}
.card.bonus .b{background:var(--butter);font-size:1.15rem}
.count{color:var(--muted);margin-bottom:1.5rem}

/* letter */
details{background:var(--panel);border-radius:18px;padding:1.5rem}
summary{font:400 1.4rem var(--serif);cursor:pointer;color:var(--butter)}
details p{margin-top:1rem;white-space:pre-line;max-width:60ch}
footer{text-align:center;color:var(--muted);padding:3rem 1rem 4rem}

/* falling flowers */
header,section,footer{position:relative;z-index:2}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:0;opacity:.75;animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-12vh,0) rotate(0deg)}to{transform:translate3d(var(--dx),112vh,0) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#petals{display:none}}

/* music gate */
.gate{position:fixed;inset:0;z-index:10;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;text-align:center;padding:1rem}
.gate[hidden]{display:none}
.gate h1{font-size:clamp(1.8rem,6vw,3rem)}
.gate button,.mute{font:600 1rem var(--sans);background:var(--rose);color:var(--ink);border:0;border-radius:999px;padding:.9rem 2rem;cursor:pointer}
.mute{position:fixed;right:1rem;bottom:1rem;z-index:5;padding:.7rem 1.1rem}
.mute[hidden]{display:none}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.in{transition:none}}
</style>
</head>
<body>

<div id="petals" aria-hidden="true"></div>

<div class="gate" id="gate">
  <h1 id="gateTitle">I made you something</h1>
  <button id="open">Tap to open</button>
</div>
<div class="gate" id="lock" style="z-index:11">
  <h1>Not yet 💕</h1>
  <p class="sub" style="margin:0">Come back at midnight. This opens in</p>
  <div id="lockClock" style="font:400 clamp(2rem,9vw,3.5rem) var(--serif);color:var(--butter);font-variant-numeric:tabular-nums"></div>
</div>
<button class="mute" id="mute" hidden>Pause music</button>

<header class="hero">
  <p id="to" class="sub" style="margin:0"></p>
  <div class="big" aria-label="38 months">38</div>
  <h1>months of us</h1>
  <div class="clock" id="clock" aria-live="off"></div>
  <p class="hint">Scroll down. There's a letter at the end.</p>
</header>

<section>
  <h2>How we got here</h2>
  <p class="sub">The moments I'd replay if I could.</p>
  <div class="tl" id="timeline"></div>
</section>

<section>
  <h2>38 reasons, one per month</h2>
  <p class="count" id="count">0 of 38 opened</p>
  <div class="grid" id="reasons"></div>
</section>

<section>
  <h2>One more thing</h2>
  <details>
    <summary>Open your letter</summary>
    <p id="letter"></p>
  </details>
</section>

<footer id="foot"></footer>

<!-- EDIT THIS BLOCK: it's the only part you need to change. Keep the quotes and commas. -->
<script type="application/json" id="data">
{
  "herName": "My love",
  "yourName": "Your name",
  "startDate": "2023-09-16",
  "music": "song.mp3",
  "unlockAt": "2026-11-17T00:00:00+08:00",
  "milestones": [
    { "date": "2023-09-16", "title": "The day it began", "text": "Write what happened and what you remember feeling." },
    { "date": "2023-11-01", "title": "Our first date", "text": "Where did you go? What did you order?" },
    { "date": "2024-02-14", "title": "Our first Valentine's", "text": "A small memory from that day." },
    { "date": "2024-08-10", "title": "Our first trip", "text": "Somewhere you both want to go back to." },
    { "date": "2025-09-16", "title": "Two years", "text": "What changed, and what stayed the same." },
    { "date": "2026-11-16", "title": "38 months", "text": "And I'd still choose you." }
  ],
  "reasons": [
    "The way you laugh at your own jokes.",
    "You remember the small things.",
    "Your good-morning voice.",
    "You make plain days feel special.",
    "How you hum when you're focused.",
    "You're kind to strangers.",
    "Your terrible puns.",
    "You believe in me on bad days.",
    "Your hand fits mine.",
    "You steal my fries and I don't mind.",
    "The way you say my name.",
    "You're brave about the scary stuff.",
    "Your late-night talks.",
    "How you light up about your favorite things.",
    "You make home feel like a person.",
    "Your hugs.",
    "You apologize honestly.",
    "You dance badly with confidence.",
    "You listen all the way through.",
    "The face you make when you're thinking.",
    "You push me to be better.",
    "Your cooking, even the failed attempts.",
    "You always pick the right song.",
    "You make me laugh when I'm angry.",
    "How loyal you are.",
    "Your messy handwriting.",
    "You celebrate my small wins.",
    "You're patient with me.",
    "Your sleepy smile.",
    "You make the future feel exciting.",
    "You're my favorite person to be quiet with.",
    "Your curiosity.",
    "You show up.",
    "You're beautiful when you're not trying.",
    "You make me want to say yes to everything.",
    "How we've grown together.",
    "You chose me, again and again.",
    "You, simply you."
  ],
  "bonusTitle": "Reason 39: tap me",
  "bonusText": "Because I'm not done loving you. Not even close.",
  "letter": "Dear love,\n\n38 months ago I didn't know how much my life was about to change. I thought it was just infatuation, but it became something deeper because we keep choosing each other, even in times of adversity. We've stayed through it all because we both want the same future together.\n\nLast night you asked me if I would sacrifice myself for you, and my answer was yes. It will always be yes, because my life is worth living with you in it.\n\nBaby, thank you for giving me a purpose, for always believing in me, and for supporting me in every ambition I have.\n\nCheers to us, my baby. I look forward to marrying you in the future.\n\nHappy 38 months. I love you.\n\n- Your name",
  "footer": "Made with love, for you."
}
</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en', {year:'numeric', month:'long', day:'numeric'});

$('to').textContent = 'For ' + D.herName;
$('letter').textContent = D.letter;
$('foot').textContent = D.footer;

// ticking clock since startDate
const start = new Date(D.startDate + 'T00:00:00');
function tick(){
  let s = Math.floor((Date.now() - start) / 1000);
  const days = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  $('clock').innerHTML = [[days,'days'],[h,'hours'],[m,'minutes'],[s,'seconds']]
    .map(([n,l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);

// timeline
$('timeline').innerHTML = D.milestones.map(e =>
  `<article class="ev"><time datetime="${e.date}">${fmt(e.date)}</time><h3></h3><p></p></article>`).join('');
document.querySelectorAll('.ev').forEach((el,i) => {
  el.querySelector('h3').textContent = D.milestones[i].title;
  el.querySelector('p').textContent = D.milestones[i].text;
});

// reasons
const grid = $('reasons'); let opened = 0;
function card(front, back, cls){
  const b = document.createElement('button');
  b.className = 'card ' + (cls || ''); b.setAttribute('aria-pressed','false');
  b.innerHTML = '<span class="in"><span class="f"></span><span class="b"></span></span>';
  b.querySelector('.f').textContent = front;
  b.querySelector('.b').textContent = back;
  let seen = false;
  b.onclick = () => {
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    if(!on && !seen){ seen = true; opened++; $('count').textContent = opened + ' of ' + (D.reasons.length + 1) + ' opened'; }
  };
  return b;
}
D.reasons.forEach((r,i) => grid.appendChild(card(i+1, r)));
grid.appendChild(card(D.bonusTitle, D.bonusText, 'bonus'));
$('count').textContent = '0 of ' + (D.reasons.length + 1) + ' opened';

// midnight lock: page stays covered until unlockAt (leave "" to disable)
const unlock = D.unlockAt ? new Date(D.unlockAt) : null;
function checkLock(){
  if(!unlock || isNaN(unlock) || Date.now() >= unlock){ $('lock').hidden = true; return true; }
  let s = Math.floor((unlock - Date.now()) / 1000);
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  const p = n => String(n).padStart(2, '0');
  $('lockClock').textContent = p(h) + ':' + p(m) + ':' + p(s);
  return false;
}
if(!checkLock()){
  const lt = setInterval(() => { if(checkLock()) clearInterval(lt); }, 1000);
}

// falling flowers
const flowers = ['🌸','🌷','🌺','🌼','💮'];
const petals = $('petals');
for(let i = 0; i < 22; i++){
  const p = document.createElement('span');
  p.className = 'petal';
  p.textContent = flowers[Math.floor(Math.random() * flowers.length)];
  p.style.left = Math.random() * 100 + '%';
  p.style.fontSize = (14 + Math.random() * 18) + 'px';
  p.style.animationDuration = (10 + Math.random() * 10) + 's';
  p.style.animationDelay = (-Math.random() * 20) + 's';
  p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
  petals.appendChild(p);
}

// music: starts when she taps "Tap to open" (browsers require a tap)
const audio = D.music ? new Audio(D.music) : null;
if(audio) audio.loop = true;
$('open').onclick = () => {
  $('gate').hidden = true;
  if(audio){
    audio.play().then(() => { $('mute').hidden = false; }).catch(() => {});
  }
};
$('mute').onclick = () => {
  if(audio.paused){ audio.play(); $('mute').textContent = 'Pause music'; }
  else { audio.pause(); $('mute').textContent = 'Play music'; }
};
</script>
</body>
</html>
